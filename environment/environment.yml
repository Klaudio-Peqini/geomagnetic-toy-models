name: geomagnetic-toy-models
channels:
  - conda-forge
dependencies:
  # Core Python
  - python=3.11
  - pip

  # Numerical computing
  - numpy>=1.24
  - scipy>=1.10

  # Data handling
  - pandas>=2.0
  - xarray>=2023.1.0

  # Plotting
  - matplotlib>=3.7
  - seaborn>=0.12

  # Notebooks
  - jupyter
  - notebook>=7.0
  - jupyterlab>=4.0
  - ipykernel>=6.25

  # Statistics / time series / signal analysis
  - statsmodels>=0.14

  # Utilities
  - tqdm>=4.66
  - pyyaml>=6.0

  # Testing
  - pytest>=7.4
  - pytest-cov>=4.1

  # Pip-only or mixed installs can go here if needed
  - pip:
      - markdown>=3.5
      - scikit-learn>=1.3
